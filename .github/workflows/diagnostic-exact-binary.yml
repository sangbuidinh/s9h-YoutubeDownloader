name: Diagnostic exact-binary probe

on:
  push:
    branches:
      - diag/runtime-bugs-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnostic-exact-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exact-binary-probe:
    name: Windows exact-binary standalone probe
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify full source SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve diagnostic source SHA" }
          if ($Actual -cne $env:SOURCE_SHA) { throw "Checked-out source differs from SOURCE_SHA" }
          if ($env:SOURCE_SHA -cnotmatch "^[0-9a-f]{40}$") { throw "SOURCE_SHA must be a full 40-character SHA" }
          Write-Host "Diagnostic source SHA: $env:SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/install_build_dependencies.py `
            --venv "$env:RUNNER_TEMP\s9h-diagnostic-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --github-env "$env:GITHUB_ENV" `
            --github-path "$env:GITHUB_PATH"
          if ($LASTEXITCODE -ne 0) { throw "Locked build dependency installation failed" }

      - name: Run exact-binary probe contract smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/smoke_fast_exact_binary_probe_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Exact-binary probe contract smoke failed" }

      - name: Prepare exact pinned yt-dlp and aria2 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $Root = Join-Path $env:RUNNER_TEMP "s9h-exact-binary-$env:SOURCE_SHA"
          $DownloadRoot = Join-Path $Root "downloads"
          $ExtractRoot = Join-Path $Root "extract"
          $BundleRoot = Join-Path $Root "bundle"
          $BinRoot = Join-Path $BundleRoot "data\bin"
          New-Item -ItemType Directory -Force -Path $DownloadRoot, $ExtractRoot, $BinRoot | Out-Null

          function Assert-Sha256 {
              param(
                  [Parameter(Mandatory = $true)][string]$Path,
                  [Parameter(Mandatory = $true)][string]$Expected,
                  [Parameter(Mandatory = $true)][string]$Name
              )
              if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "$Name is missing" }
              $Actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToUpperInvariant()
              if ($Actual -ne $Expected.ToUpperInvariant()) { throw "$Name SHA-256 mismatch: $Actual" }
              return $Actual
          }

          $YtDlpDownload = Join-Path $DownloadRoot "yt-dlp.exe"
          Invoke-WebRequest `
              -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.03.17/yt-dlp.exe" `
              -OutFile $YtDlpDownload
          [void](Assert-Sha256 `
              -Path $YtDlpDownload `
              -Expected "3DB811B366B2DA47337D2FCFDFE5BBD9A258DAD3F350C54974F005DF115A1545" `
              -Name "yt-dlp.exe")

          $AriaArchive = Join-Path $DownloadRoot "aria2.zip"
          Invoke-WebRequest `
              -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" `
              -OutFile $AriaArchive
          [void](Assert-Sha256 `
              -Path $AriaArchive `
              -Expected "67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288" `
              -Name "aria2 archive")
          Expand-Archive -LiteralPath $AriaArchive -DestinationPath $ExtractRoot
          $AriaMatches = @(Get-ChildItem -LiteralPath $ExtractRoot -Recurse -Filter "aria2c.exe" -File)
          if ($AriaMatches.Count -ne 1) { throw "aria2 archive layout changed" }
          [void](Assert-Sha256 `
              -Path $AriaMatches[0].FullName `
              -Expected "BE2099C214F63A3CB4954B09A0BECD6E2E34660B886D4C898D260FEBFE9D70C2" `
              -Name "aria2c.exe")

          Copy-Item -LiteralPath $YtDlpDownload -Destination (Join-Path $BinRoot "yt-dlp.exe")
          Copy-Item -LiteralPath $AriaMatches[0].FullName -Destination (Join-Path $BinRoot "aria2c.exe")

          "DIAGNOSTIC_BUNDLE_ROOT=$BundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build standalone exact-binary probe EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller `
              --noconfirm `
              --clean `
              --onefile `
              --console `
              --name FastExactBinaryProbe `
              scripts/diagnose_fast_exact_binaries.py
          if ($LASTEXITCODE -ne 0) { throw "FastExactBinaryProbe.exe build failed" }
          Copy-Item -LiteralPath "dist\FastExactBinaryProbe.exe" -Destination (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "FastExactBinaryProbe.exe")

      - name: Attach immutable diagnostic build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $YtDlpPath = Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "data\bin\yt-dlp.exe"
          $Aria2Path = Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "data\bin\aria2c.exe"
          $ProbePath = Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "FastExactBinaryProbe.exe"
          $Manifest = [ordered]@{
              schema_version = 1
              purpose = "bug-03-exact-binary-probe"
              source_sha = $env:SOURCE_SHA
              source_branch = "diag/runtime-bugs-20260822"
              workflow_run_id = "${{ github.run_id }}"
              workflow_run_attempt = "${{ github.run_attempt }}"
              built_utc = [DateTime]::UtcNow.ToString("o")
              yt_dlp_sha256 = (Get-FileHash -LiteralPath $YtDlpPath -Algorithm SHA256).Hash.ToLowerInvariant()
              aria2_sha256 = (Get-FileHash -LiteralPath $Aria2Path -Algorithm SHA256).Hash.ToLowerInvariant()
              probe_sha256 = (Get-FileHash -LiteralPath $ProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $Manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "DIAGNOSTIC_BUILD.json") -Encoding utf8
          Set-Content -LiteralPath (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "DIAGNOSTIC_BUILD_SHA.txt") -Value $env:SOURCE_SHA -Encoding ascii
          @"
          BUG-03 exact-binary standalone diagnostic bundle
          Source SHA: $env:SOURCE_SHA

          Run FastExactBinaryProbe.exe before any deeper application instrumentation.
          JSONL is written to %TEMP%\s9h-ytdl-diag and each record is flush()+fsync()'d before the next record.
          This bundle is diagnostic-only and must never be merged into a production release.
          "@ | Set-Content -LiteralPath (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "README_DIAGNOSTIC.txt") -Encoding utf8

      - name: Run exact-binary standalone probe
        id: exact_probe
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $PreviousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              $PSNativeCommandUseErrorActionPreference = $false
              & (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "FastExactBinaryProbe.exe") --root $env:DIAGNOSTIC_BUNDLE_ROOT
              $ProbeExit = $LASTEXITCODE
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $PreviousNativePreference
          }

          $ResultRoot = Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "probe-results"
          New-Item -ItemType Directory -Force -Path $ResultRoot | Out-Null
          $LogRoot = Join-Path $env:TEMP "s9h-ytdl-diag"
          $Latest = @(
              Get-ChildItem -LiteralPath $LogRoot -Filter "fast-exact-binary-probe-*.jsonl" -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1
          )
          if ($Latest.Count -eq 1) {
              Copy-Item -LiteralPath $Latest[0].FullName -Destination (Join-Path $ResultRoot "ci-fast-exact-binary-probe.jsonl")
          }
          else {
              Set-Content -LiteralPath (Join-Path $ResultRoot "NO_JSONL_CAPTURED.txt") -Value "Exact-binary probe produced no JSONL."
          }

          "FAST_EXACT_PROBE_EXIT=$ProbeExit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($ProbeExit -ne 0) {
              Write-Error "Exact-binary standalone probe failed with exit code $ProbeExit"
              exit $ProbeExit
          }

      - name: Upload SHA-tagged diagnostic bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s9h-bug03-exact-binary-${{ env.SOURCE_SHA }}
          path: ${{ env.DIAGNOSTIC_BUNDLE_ROOT }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 2

      - name: Enforce no-deep-instrumentation gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:FAST_EXACT_PROBE_EXIT)) {
              throw "Exact-binary probe exit code was not recorded"
          }
          if ([int]$env:FAST_EXACT_PROBE_EXIT -ne 0) {
              throw "Exact-binary probe failed; BUG-03 deep instrumentation remains blocked"
          }
          Write-Host "Exact-binary probe passed; deeper BUG-03 instrumentation may proceed only if the app symptom remains unexplained."
