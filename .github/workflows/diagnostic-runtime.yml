name: Diagnostic runtime exact-binary probe

on:
  push:
    branches:
      - diag/runtime-bugs-20260822

permissions:
  contents: read

concurrency:
  group: diagnostic-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exact-binary-probe:
    name: Windows exact-binary standalone probe
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostic source SHA
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $Actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve diagnostic source SHA"
          }
          if ($Actual -cne $env:SOURCE_SHA) {
              throw "Checked-out source SHA differs from github.sha"
          }
          if ($env:SOURCE_SHA -cnotmatch "^[0-9a-f]{40}$") {
              throw "Diagnostic source SHA is not a full 40-character commit SHA"
          }
          Write-Host "Diagnostic source SHA: $env:SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install locked build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/install_build_dependencies.py `
            --venv "$env:RUNNER_TEMP\s9h-diagnostic-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --github-env "$env:GITHUB_ENV" `
            --github-path "$env:GITHUB_PATH"
          if ($LASTEXITCODE -ne 0) {
              throw "Locked build dependency installation failed"
          }

      - name: Run probe contract smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/smoke_fast_exact_binary_probe_contract.py
          if ($LASTEXITCODE -ne 0) {
              throw "Exact-binary probe contract smoke failed"
          }

      - name: Prepare exact pinned runtime binaries
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $DownloadRoot = Join-Path $env:RUNNER_TEMP "s9h-diagnostic-downloads-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $ExtractRoot = Join-Path $env:RUNNER_TEMP "s9h-diagnostic-extract-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $RuntimeRoot = Join-Path $env:RUNNER_TEMP "s9h-diagnostic-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $BinRoot = Join-Path $RuntimeRoot "data\bin"
          New-Item -ItemType Directory -Force -Path $DownloadRoot, $ExtractRoot, $BinRoot | Out-Null

          function Assert-Sha256 {
              param(
                  [Parameter(Mandatory = $true)][string]$Path,
                  [Parameter(Mandatory = $true)][string]$Expected,
                  [Parameter(Mandatory = $true)][string]$Name
              )
              if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
                  throw "$Name is missing"
              }
              $Actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToUpperInvariant()
              if ($Actual -ne $Expected.ToUpperInvariant()) {
                  throw "$Name SHA-256 mismatch: $Actual"
              }
              return $Actual
          }

          function Download-Checked {
              param(
                  [Parameter(Mandatory = $true)][string]$Uri,
                  [Parameter(Mandatory = $true)][string]$Destination,
                  [Parameter(Mandatory = $true)][string]$Expected,
                  [Parameter(Mandatory = $true)][string]$Name
              )
              Invoke-WebRequest -Uri $Uri -OutFile $Destination
              [void](Assert-Sha256 -Path $Destination -Expected $Expected -Name $Name)
          }

          $YtDlp = Join-Path $DownloadRoot "yt-dlp.exe"
          Download-Checked `
              -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.03.17/yt-dlp.exe" `
              -Destination $YtDlp `
              -Expected "3DB811B366B2DA47337D2FCFDFE5BBD9A258DAD3F350C54974F005DF115A1545" `
              -Name "yt-dlp.exe"

          $AriaArchive = Join-Path $DownloadRoot "aria2.zip"
          Download-Checked `
              -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" `
              -Destination $AriaArchive `
              -Expected "67D015301EEF0B612191212D564C5BB0A14B5B9C4796B76454276A4D28D9B288" `
              -Name "aria2 archive"
          $AriaExtract = Join-Path $ExtractRoot "aria2"
          Expand-Archive -LiteralPath $AriaArchive -DestinationPath $AriaExtract
          $Aria2 = @(Get-ChildItem -LiteralPath $AriaExtract -Recurse -Filter "aria2c.exe" -File)
          if ($Aria2.Count -ne 1) { throw "aria2 archive did not contain exactly one aria2c.exe" }
          [void](Assert-Sha256 `
              -Path $Aria2[0].FullName `
              -Expected "BE2099C214F63A3CB4954B09A0BECD6E2E34660B886D4C898D260FEBFE9D70C2" `
              -Name "aria2c.exe")

          $FfmpegArchive = Join-Path $DownloadRoot "ffmpeg.zip"
          Download-Checked `
              -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip" `
              -Destination $FfmpegArchive `
              -Expected "DB580001CAA24AC104C8CB856CD113A87B0A443F7BDF47D8C12B1D740584A2EC" `
              -Name "FFmpeg archive"
          $FfmpegExtract = Join-Path $ExtractRoot "ffmpeg"
          Expand-Archive -LiteralPath $FfmpegArchive -DestinationPath $FfmpegExtract
          $Ffmpeg = @(Get-ChildItem -LiteralPath $FfmpegExtract -Recurse -Filter "ffmpeg.exe" -File)
          $Ffprobe = @(Get-ChildItem -LiteralPath $FfmpegExtract -Recurse -Filter "ffprobe.exe" -File)
          if ($Ffmpeg.Count -ne 1 -or $Ffprobe.Count -ne 1) { throw "FFmpeg archive layout changed" }
          [void](Assert-Sha256 `
              -Path $Ffmpeg[0].FullName `
              -Expected "1326DDE4C84FF1F96FE6B8916C5BED29E163E9B5DCCF995F6F3DB069D143EC5E" `
              -Name "ffmpeg.exe")
          [void](Assert-Sha256 `
              -Path $Ffprobe[0].FullName `
              -Expected "B49CCC7C6547B141AD5A2F6EC69CC04323D7133D7704D70B331B904C63EECB07" `
              -Name "ffprobe.exe")

          $DenoArchive = Join-Path $DownloadRoot "deno.zip"
          Download-Checked `
              -Uri "https://github.com/denoland/deno/releases/download/v2.7.14/deno-x86_64-pc-windows-msvc.zip" `
              -Destination $DenoArchive `
              -Expected "25F9871F5C1D9E999D60071F8069767134495FD601D2E2C7CE1E8C641487BDA0" `
              -Name "Deno archive"
          $DenoExtract = Join-Path $ExtractRoot "deno"
          Expand-Archive -LiteralPath $DenoArchive -DestinationPath $DenoExtract
          $Deno = @(Get-ChildItem -LiteralPath $DenoExtract -Recurse -Filter "deno.exe" -File)
          if ($Deno.Count -ne 1) { throw "Deno archive did not contain exactly one deno.exe" }
          [void](Assert-Sha256 `
              -Path $Deno[0].FullName `
              -Expected "B6E83993F1F1AB97075A77043DE61118966D719B5450BC631251D47C3A34230B" `
              -Name "deno.exe")

          Copy-Item -LiteralPath $YtDlp -Destination (Join-Path $BinRoot "yt-dlp.exe")
          Copy-Item -LiteralPath $Aria2[0].FullName -Destination (Join-Path $BinRoot "aria2c.exe")
          Copy-Item -LiteralPath $Ffmpeg[0].FullName -Destination (Join-Path $BinRoot "ffmpeg.exe")
          Copy-Item -LiteralPath $Ffprobe[0].FullName -Destination (Join-Path $BinRoot "ffprobe.exe")
          Copy-Item -LiteralPath $Deno[0].FullName -Destination (Join-Path $BinRoot "deno.exe")

          "DIAGNOSTIC_RUNTIME_ROOT=$RuntimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application and standalone probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/package_windows.py
          if ($LASTEXITCODE -ne 0) {
              throw "Application diagnostic build failed"
          }

          pyinstaller `
              --noconfirm `
              --clean `
              --onefile `
              --console `
              --name FastExactBinaryProbe `
              scripts/diagnose_fast_exact_binaries.py
          if ($LASTEXITCODE -ne 0) {
              throw "Standalone exact-binary probe build failed"
          }

      - name: Assemble SHA-tagged diagnostic build
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $BundleRoot = Join-Path $env:RUNNER_TEMP "s9h-diagnostic-$env:SOURCE_SHA"
          $BinRoot = Join-Path $BundleRoot "data\bin"
          New-Item -ItemType Directory -Force -Path $BinRoot | Out-Null

          Copy-Item -LiteralPath "dist\Youtube Downloaderbs.exe" -Destination (Join-Path $BundleRoot "Youtube.Downloaderbs.exe")
          Copy-Item -LiteralPath "dist\FastExactBinaryProbe.exe" -Destination (Join-Path $BundleRoot "FastExactBinaryProbe.exe")
          Copy-Item -LiteralPath (Join-Path $env:DIAGNOSTIC_RUNTIME_ROOT "data\bin\*") -Destination $BinRoot

          $YtDlpPath = Join-Path $BinRoot "yt-dlp.exe"
          $Aria2Path = Join-Path $BinRoot "aria2c.exe"
          $AppPath = Join-Path $BundleRoot "Youtube.Downloaderbs.exe"
          $ProbePath = Join-Path $BundleRoot "FastExactBinaryProbe.exe"

          $Manifest = [ordered]@{
              schema_version = 1
              purpose = "runtime-bug-diagnostic"
              source_sha = $env:SOURCE_SHA
              source_branch = "diag/runtime-bugs-20260822"
              workflow_run_id = "${{ github.run_id }}"
              workflow_run_attempt = "${{ github.run_attempt }}"
              built_utc = [DateTime]::UtcNow.ToString("o")
              yt_dlp_sha256 = (Get-FileHash -LiteralPath $YtDlpPath -Algorithm SHA256).Hash.ToLowerInvariant()
              aria2_sha256 = (Get-FileHash -LiteralPath $Aria2Path -Algorithm SHA256).Hash.ToLowerInvariant()
              app_sha256 = (Get-FileHash -LiteralPath $AppPath -Algorithm SHA256).Hash.ToLowerInvariant()
              probe_sha256 = (Get-FileHash -LiteralPath $ProbePath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $Manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $BundleRoot "DIAGNOSTIC_BUILD.json") -Encoding utf8
          Set-Content -LiteralPath (Join-Path $BundleRoot "DIAGNOSTIC_BUILD_SHA.txt") -Value $env:SOURCE_SHA -Encoding ascii
          @"
          S9H diagnostic runtime build
          Source SHA: $env:SOURCE_SHA

          Run FastExactBinaryProbe.exe before using any deeper application instrumentation.
          Probe JSONL is written to %TEMP%\s9h-ytdl-diag and is flushed+fsync'd per record.
          This diagnostic artifact must never be merged or shipped as a production release.
          "@ | Set-Content -LiteralPath (Join-Path $BundleRoot "README_DIAGNOSTIC.txt") -Encoding utf8

          "DIAGNOSTIC_BUNDLE_ROOT=$BundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run exact-binary standalone probe
        id: exact_probe
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $PreviousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              $PSNativeCommandUseErrorActionPreference = $false
              & (Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "FastExactBinaryProbe.exe") `
                  --root $env:DIAGNOSTIC_BUNDLE_ROOT
              $ProbeExit = $LASTEXITCODE
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $PreviousNativePreference
          }

          $ResultRoot = Join-Path $env:DIAGNOSTIC_BUNDLE_ROOT "probe-results"
          New-Item -ItemType Directory -Force -Path $ResultRoot | Out-Null
          $LogRoot = Join-Path $env:TEMP "s9h-ytdl-diag"
          $Latest = @(
              Get-ChildItem -LiteralPath $LogRoot -Filter "fast-exact-binary-probe-*.jsonl" -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTimeUtc -Descending |
                  Select-Object -First 1
          )
          if ($Latest.Count -eq 1) {
              Copy-Item -LiteralPath $Latest[0].FullName -Destination (Join-Path $ResultRoot "ci-fast-exact-binary-probe.jsonl")
          }
          else {
              Set-Content -LiteralPath (Join-Path $ResultRoot "NO_JSONL_CAPTURED.txt") -Value "Exact-binary probe created no JSONL file."
          }

          "FAST_EXACT_PROBE_EXIT=$ProbeExit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($ProbeExit -ne 0) {
              Write-Error "Exact-binary standalone probe failed with exit code $ProbeExit"
              exit $ProbeExit
          }

      - name: Upload SHA-tagged diagnostic artifact
        if: always()
        id: upload-diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s9h-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/s9h-diagnostic-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 2

      - name: Enforce exact-binary probe gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:FAST_EXACT_PROBE_EXIT)) {
              throw "Exact-binary probe exit code was not recorded"
          }
          if ([int]$env:FAST_EXACT_PROBE_EXIT -ne 0) {
              throw "Exact-binary standalone probe failed; do not add deeper BUG-03 instrumentation yet"
          }
          Write-Host "Exact-binary standalone probe passed. Deeper BUG-03 instrumentation is now permitted if still needed."
