name: Prerelease v1.3.0-rc.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-v1.3.0-rc.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-rc.1
          fetch-depth: 0
      - name: Verify annotated tag and release absence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -ne "refs/tags/v1.3.0-rc.1") {
            throw "This workflow must be dispatched from tag v1.3.0-rc.1"
          }
          if ((git cat-file -t v1.3.0-rc.1) -ne "tag") {
            throw "v1.3.0-rc.1 must be an annotated tag"
          }
          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 v1.3.0-rc.1).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Checked-out commit does not match v1.3.0-rc.1"
          }
          gh release view v1.3.0-rc.1 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub release v1.3.0-rc.1 already exists"
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Could not verify GitHub release absence"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build and validate checksum-pinned assets
        shell: pwsh
        run: .\scripts\build_prerelease_v1_3_0_rc1.ps1 -PreparePinnedRuntime
      - name: Keep downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Youtube-Downloaderbs-v1.3.0-rc.1
          path: release/assets/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-rc.1
          name: Youtube Downloaderbs v1.3.0-rc.1
          prerelease: true
          draft: false
          body_path: release/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/assets/Youtube.Downloaderbs.exe
            release/assets/Youtube-Downloaderbs-v1.3.0-rc.1.zip
