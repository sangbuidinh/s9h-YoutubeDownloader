name: Prerelease v1.3.0-rc.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-v1.3.0-rc.1
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload-release-bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-release-bundle.outputs.artifact-digest }}
      source-commit: ${{ steps.release-metadata.outputs.source-commit }}
      control-commit: ${{ steps.release-metadata.outputs.control-commit }}
    steps:
      - name: Check out workflow control source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: control
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Verify pinned Python version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $VersionOutput = (& python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "Could not query Python version"
          }
          if ($VersionOutput -ne "Python 3.11.9") {
              throw "Unexpected Python version: $VersionOutput"
          }

          Write-Host "Pinned Python verified: $VersionOutput"
      - name: Enforce fail-closed release legal gate
        shell: pwsh
        run: |
          python control/scripts/verify_release_legal_gate.py `
            --policy control/legal/release-policy.json `
            --tag v1.3.0-rc.1
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python control/scripts/install_build_dependencies.py `
            --venv "$env:RUNNER_TEMP\s9h-build-venv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --github-env "$env:GITHUB_ENV" `
            --github-path "$env:GITHUB_PATH"
          if ($LASTEXITCODE -ne 0) {
              throw "Locked build dependency installation failed"
          }
      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: source
          ref: v1.3.0-rc.1
          fetch-depth: 0
      - name: Verify annotated tag and release absence
        id: release-metadata
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
            throw "This workflow only supports workflow_dispatch"
          }

          $tag = "v1.3.0-rc.1"
          $expectedTagCommit = "e2e93f3cf9beb1d4a8df2954017f6662e28878e4"

          $tagType = (git cat-file -t $tag).Trim()
          if ($tagType -ne "tag") {
            throw "$tag must be an annotated tag"
          }

          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Checked-out commit does not match $tag"
          }

          $controlCommit = (git -C ..\control rev-parse HEAD).Trim()
          if ($headCommit -cnotmatch "^[0-9a-f]{40}$") {
            throw "Release source commit is invalid"
          }
          if ($controlCommit -cnotmatch "^[0-9a-f]{40}$") {
            throw "Workflow control commit is invalid"
          }
          "source-commit=$headCommit" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "control-commit=$controlCommit" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release source commit: $headCommit"
          Write-Host "Workflow control commit: $controlCommit"

          if ($tagCommit -ne $expectedTagCommit) {
            throw (
              "$tag points to unexpected commit. " +
              "Expected $expectedTagCommit, received $tagCommit"
            )
          }

          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $releaseViewOutput = @(
              & gh release view $tag `
                --repo "${{ github.repository }}" `
                2>&1
            )
            $releaseViewExitCode = $LASTEXITCODE
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }

          if ($releaseViewExitCode -eq 0) {
            throw "GitHub release $tag already exists"
          }

          if ($releaseViewExitCode -ne 1) {
            throw (
              "Could not verify GitHub release absence. " +
              "gh exit code: $releaseViewExitCode"
            )
          }

          $releaseViewText = ($releaseViewOutput | Out-String).Trim()
          $expectedMissingReleaseText = (
            $releaseViewText -match
            "(?i)(release\s+not\s+found|not\s+found|HTTP\s+404)"
          )

          if (-not $expectedMissingReleaseText) {
            throw (
              "gh returned exit code 1, but the response did not confirm " +
              "that the release is absent"
            )
          }

          Write-Host "Confirmed: GitHub release $tag does not exist."
          $global:LASTEXITCODE = 0
          exit 0
      - name: Configure canonical Windows temp path
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $requestedTemp = Join-Path `
            $env:USERPROFILE `
            "s9h-actions-temp\$env:GITHUB_RUN_ID"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $requestedTemp |
            Out-Null

          $resolvedOutput = @(
            & python -c `
              "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=False))" `
              $requestedTemp
          )
          $resolveExitCode = $LASTEXITCODE

          if ($resolveExitCode -ne 0) {
            throw "Could not resolve the canonical Windows temporary directory"
          }

          $resolvedTemp = $resolvedOutput | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace([string]$resolvedTemp)) {
            throw "Python returned an empty canonical temporary path"
          }

          $resolvedTemp = ([string]$resolvedTemp).Trim()
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $resolvedTemp |
            Out-Null

          $env:TEMP = $resolvedTemp
          $env:TMP = $resolvedTemp
          $env:TMPDIR = $resolvedTemp

          "TEMP=$resolvedTemp" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$resolvedTemp" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=$resolvedTemp" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          with TemporaryDirectory() as temp_dir:
              raw_path = Path(temp_dir) / "data" / "download_state.sqlite3"
              canonical_path = raw_path.resolve(strict=False)

              print(f"temporary-path-canonical={raw_path == canonical_path}")
              if raw_path != canonical_path:
                  print(f"raw={raw_path}")
                  print(f"canonical={canonical_path}")
                  raise SystemExit("Configured temporary path is still not canonical")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Canonical temporary-path probe failed"
          }

          python scripts\smoke_sqlite_startup_state.py
          if ($LASTEXITCODE -ne 0) {
            throw "SQLite startup smoke still fails with the canonical temporary root"
          }

          Write-Host "Canonical Windows temporary root validated successfully."
          $global:LASTEXITCODE = 0
          exit 0
      - name: Build and validate checksum-pinned assets
        shell: pwsh
        working-directory: source
        run: .\scripts\build_prerelease_v1_3_0_rc1.ps1 -PreparePinnedRuntime
      - name: Prepare and verify release legal payload
        shell: pwsh
        working-directory: source
        run: |
          python ..\control\scripts\prepare_release_legal_payload.py create `
            --control-root ..\control `
            --portable-zip release/assets/Youtube-Downloaderbs-v1.3.0-rc.1.zip `
            --output-zip release/assets/Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip `
            --release-notes release/RELEASE_NOTES.md `
            --tag v1.3.0-rc.1 `
            --source-commit "${{ steps.release-metadata.outputs.source-commit }}" `
            --control-commit "${{ steps.release-metadata.outputs.control-commit }}"
          if ($LASTEXITCODE -ne 0) {
              throw "Release legal payload preparation failed"
          }

          python ..\control\scripts\prepare_release_legal_payload.py verify `
            --control-root ..\control `
            --portable-zip release/assets/Youtube-Downloaderbs-v1.3.0-rc.1.zip `
            --legal-zip release/assets/Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip `
            --release-notes release/RELEASE_NOTES.md `
            --tag v1.3.0-rc.1 `
            --source-commit "${{ steps.release-metadata.outputs.source-commit }}" `
            --control-commit "${{ steps.release-metadata.outputs.control-commit }}"
          if ($LASTEXITCODE -ne 0) {
              throw "Release legal payload verification failed"
          }
      - name: Create and verify release bundle
        shell: pwsh
        working-directory: source
        run: |
          python ..\control\scripts\prepare_release_bundle.py create `
            --release-root release `
            --bundle-root release/publish-bundle `
            --tag v1.3.0-rc.1 `
            --source-commit "${{ steps.release-metadata.outputs.source-commit }}" `
            --control-commit "${{ steps.release-metadata.outputs.control-commit }}" `
            --prerelease true `
            --policy ..\control\legal\release-policy.json `
            --asset-contract ..\control\legal\release-assets-v2.json `
            --legal-payload release/assets/Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip `
            --source-assets-root release/source-assets
          if ($LASTEXITCODE -ne 0) {
              throw "Release bundle creation failed"
          }

          python ..\control\scripts\prepare_release_bundle.py verify `
            --bundle-root release/publish-bundle `
            --tag v1.3.0-rc.1 `
            --source-commit "${{ steps.release-metadata.outputs.source-commit }}" `
            --control-commit "${{ steps.release-metadata.outputs.control-commit }}" `
            --prerelease true `
            --policy ..\control\legal\release-policy.json `
            --asset-contract ..\control\legal\release-assets-v2.json `
            --legal-payload release/publish-bundle/assets/Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip `
            --source-assets-root release/publish-bundle/assets `
            --require-release-ready false
          if ($LASTEXITCODE -ne 0) {
              throw "Release bundle verification failed"
          }
      - name: Upload release bundle
        id: upload-release-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-v1.3.0-rc.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/release/publish-bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 7
      - name: Report immutable release bundle handoff
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload-release-bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-release-bundle.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_ID -notmatch "^[1-9][0-9]*$") {
              throw "Release bundle artifact ID is invalid"
          }
          if ($env:ARTIFACT_DIGEST -cnotmatch "^[0-9a-f]{64}$") {
              throw "Release bundle artifact digest is invalid"
          }
          Write-Host "Release bundle artifact ID: $env:ARTIFACT_ID"
          Write-Host "Release bundle artifact digest: $env:ARTIFACT_DIGEST"

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Validate immutable build outputs
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          CONTROL_COMMIT: ${{ needs.build.outputs.control-commit }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_ID -notmatch "^[1-9][0-9]*$") {
              throw "Release bundle artifact ID is invalid"
          }
          if ($env:ARTIFACT_DIGEST -cnotmatch "^[0-9a-f]{64}$") {
              throw "Release bundle artifact digest is invalid"
          }
          if ($env:SOURCE_COMMIT -cnotmatch "^[0-9a-f]{40}$") {
              throw "Release source commit is invalid"
          }
          if ($env:CONTROL_COMMIT -cnotmatch "^[0-9a-f]{40}$") {
              throw "Workflow control commit is invalid"
          }
          Write-Host "Release source commit: $env:SOURCE_COMMIT"
          Write-Host "Workflow control commit: $env:CONTROL_COMMIT"
          Write-Host "Release bundle artifact ID: $env:ARTIFACT_ID"
          Write-Host "Release bundle artifact digest: $env:ARTIFACT_DIGEST"
      - name: Check out publish workflow controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build.outputs.control-commit }}
          path: control
          persist-credentials: false
      - name: Set up publish Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Verify publish Python version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          $VersionOutput = (& python --version 2>&1 | Out-String).Trim()
          if ($VersionOutput -ne "Python 3.11.9") {
              throw "Unexpected Python version: $VersionOutput"
          }
          Write-Host "Pinned publish Python verified: $VersionOutput"
      - name: Download release bundle by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-bundle
          merge-multiple: true
      - name: Verify downloaded release bundle
        shell: pwsh
        env:
          EXPECTED_TAG: v1.3.0-rc.1
          EXPECTED_PRERELEASE: "true"
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          EXPECTED_CONTROL_COMMIT: ${{ needs.build.outputs.control-commit }}
          EXPECTED_ZIP: Youtube-Downloaderbs-v1.3.0-rc.1.zip
          EXPECTED_LEGAL: Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip
          EXPECTED_ARIA2_SOURCE: Youtube-Downloaderbs-v1.3.0-rc.1-aria2-source.zip
          EXPECTED_FFMPEG_SOURCE: Youtube-Downloaderbs-v1.3.0-rc.1-ffmpeg-source.zip
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          function Assert-ExactKeys($Value, [string[]]$Expected, [string]$Label) {
              $actual = @($Value.PSObject.Properties.Name | Sort-Object)
              $wanted = @($Expected | Sort-Object)
              if (@(Compare-Object $actual $wanted).Count -ne 0) {
                  throw "$Label fields are invalid"
              }
          }

          function Assert-Record($Record, [string]$ExpectedName, [string]$Path) {
              Assert-ExactKeys $Record @("name", "sha256", "size") $ExpectedName
              if ($Record.name -cne $ExpectedName) {
                  throw "$ExpectedName record name is invalid"
              }
              if ([int64]$Record.size -le 0) {
                  throw "$ExpectedName record size is invalid"
              }
              if ([string]$Record.sha256 -cnotmatch "^[0-9a-f]{64}$") {
                  throw "$ExpectedName record digest is invalid"
              }
              $item = Get-Item -LiteralPath $Path
              if ($item.Length -ne [int64]$Record.size) {
                  throw "$ExpectedName size does not match"
              }
              $digest = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cne [string]$Record.sha256) {
                  throw "$ExpectedName digest does not match"
              }
          }

          function Assert-AssetRecord($Record, [string]$ExpectedName, [string]$ExpectedRole, [string]$Path) {
              Assert-ExactKeys $Record @("name", "role", "sha256", "size") $ExpectedName
              if ($Record.role -cne $ExpectedRole) {
                  throw "$ExpectedName role is invalid"
              }
              $fileRecord = [PSCustomObject]@{
                  name = $Record.name
                  sha256 = $Record.sha256
                  size = $Record.size
              }
              Assert-Record $fileRecord $ExpectedName $Path
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $bundle = [IO.Path]::GetFullPath((Join-Path $workspace "release-bundle"))
          if (-not $bundle.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Release bundle escaped the workspace"
          }
          $rootItem = Get-Item -LiteralPath $bundle
          if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Release bundle root is a reparse point"
          }
          $items = @(Get-ChildItem -LiteralPath $bundle -Force -Recurse)
          if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
              throw "Release bundle contains a reparse point"
          }
          $directories = @($items | Where-Object { $_.PSIsContainer })
          $files = @($items | Where-Object { -not $_.PSIsContainer })
          if ($directories.Count -ne 1 -or $directories[0].FullName -ne (Join-Path $bundle "assets")) {
              throw "Release bundle directory layout is invalid"
          }
          $relativeFiles = @($files | ForEach-Object { $_.FullName.Substring($bundle.Length + 1).Replace("\", "/") } | Sort-Object)
          $expectedFiles = @(
              "RELEASE_MANIFEST.json",
              "RELEASE_NOTES.md",
              "assets/SHA256SUMS.txt",
              "assets/Youtube.Downloaderbs.exe",
              "assets/$env:EXPECTED_ZIP",
              "assets/$env:EXPECTED_LEGAL",
              "assets/$env:EXPECTED_ARIA2_SOURCE",
              "assets/$env:EXPECTED_FFMPEG_SOURCE"
          ) | Sort-Object
          if (@(Compare-Object $relativeFiles $expectedFiles).Count -ne 0) {
              throw "Release bundle file layout is invalid"
          }

          $manifestPath = Join-Path $bundle "RELEASE_MANIFEST.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          Assert-ExactKeys $manifest @(
              "assets", "bundle_format", "checksum_file", "control_commit",
              "legal_compliance_certified", "prerelease", "release_blockers",
              "release_notes", "release_ready", "release_tag", "schema_version",
              "source_availability_certified", "source_commit"
          ) "Release manifest"
          if ([int]$manifest.schema_version -ne 2 -or $manifest.bundle_format -cne "s9h-release-bundle-v2") {
              throw "Release manifest contract is invalid"
          }
          if ($manifest.release_tag -cne $env:EXPECTED_TAG) {
              throw "Release manifest tag is invalid"
          }
          $expectedPrerelease = [bool]::Parse($env:EXPECTED_PRERELEASE)
          if ([bool]$manifest.prerelease -ne $expectedPrerelease) {
              throw "Release manifest prerelease flag is invalid"
          }
          if ($manifest.source_commit -cne $env:EXPECTED_SOURCE_COMMIT -or $manifest.control_commit -cne $env:EXPECTED_CONTROL_COMMIT) {
              throw "Release manifest commit metadata is invalid"
          }
          if ([bool]$manifest.release_ready -or [bool]$manifest.legal_compliance_certified -or [bool]$manifest.source_availability_certified) {
              throw "Release manifest readiness is invalid"
          }
          if (@($manifest.release_blockers).Count -le 0) {
              throw "Release manifest blockers are missing"
          }
          $assets = @($manifest.assets)
          if ($assets.Count -ne 5) {
              throw "Release manifest asset count is invalid"
          }
          $expectedRoles = @{}
          $expectedRoles["Youtube.Downloaderbs.exe"] = "application-executable"
          $expectedRoles[$env:EXPECTED_ZIP] = "portable-package"
          $expectedRoles[$env:EXPECTED_LEGAL] = "legal-payload"
          $expectedRoles[$env:EXPECTED_ARIA2_SOURCE] = "aria2-source"
          $expectedRoles[$env:EXPECTED_FFMPEG_SOURCE] = "ffmpeg-source"
          $expectedAssetNames = @($expectedRoles.Keys | Sort-Object)
          $assetNames = @($assets | ForEach-Object { [string]$_.name })
          if (@(Compare-Object $assetNames $expectedAssetNames -SyncWindow 0).Count -ne 0) {
              throw "Release manifest assets are not exact and sorted"
          }
          foreach ($asset in $assets) {
              Assert-AssetRecord $asset ([string]$asset.name) $expectedRoles[[string]$asset.name] (Join-Path $bundle "assets\$($asset.name)")
          }
          Assert-Record $manifest.checksum_file "SHA256SUMS.txt" (Join-Path $bundle "assets\SHA256SUMS.txt")
          Assert-Record $manifest.release_notes "RELEASE_NOTES.md" (Join-Path $bundle "RELEASE_NOTES.md")

          $checksumPath = Join-Path $bundle "assets\SHA256SUMS.txt"
          $checksumBytes = [IO.File]::ReadAllBytes($checksumPath)
          if ($checksumBytes.Length -ge 3 -and $checksumBytes[0] -eq 0xEF -and $checksumBytes[1] -eq 0xBB -and $checksumBytes[2] -eq 0xBF) {
              throw "Checksum file contains a BOM"
          }
          $checksumText = [Text.UTF8Encoding]::new($false, $true).GetString($checksumBytes)
          if ($checksumText.Contains("`r") -or -not $checksumText.EndsWith("`n") -or $checksumText.EndsWith("`n`n")) {
              throw "Checksum file line endings are invalid"
          }
          $checksumLines = @($checksumText.TrimEnd("`n").Split("`n"))
          $expectedChecksumLines = @($assets | Sort-Object name | ForEach-Object { "$($_.sha256)  $($_.name)" })
          if ($checksumLines.Count -ne 5 -or @(Compare-Object $checksumLines $expectedChecksumLines -SyncWindow 0).Count -ne 0) {
              throw "Checksum file content is invalid"
          }
          if ((Get-Item -LiteralPath (Join-Path $bundle "assets\Youtube.Downloaderbs.exe")).Length -le 0) {
              throw "EXE asset is empty"
          }
          if ((Get-Item -LiteralPath (Join-Path $bundle "assets\$env:EXPECTED_ZIP")).Length -le 0) {
              throw "Portable ZIP asset is empty"
          }
          foreach ($requiredArchive in @($env:EXPECTED_LEGAL, $env:EXPECTED_ARIA2_SOURCE, $env:EXPECTED_FFMPEG_SOURCE)) {
              if ((Get-Item -LiteralPath (Join-Path $bundle "assets\$requiredArchive")).Length -le 0) {
                  throw "Required release archive is empty: $requiredArchive"
              }
          }

          Write-Host "Release bundle v2 handoff verified"
      - name: Enforce publish-ready release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python control/scripts/prepare_release_bundle.py verify `
            --bundle-root release-bundle `
            --tag v1.3.0-rc.1 `
            --source-commit "${{ needs.build.outputs.source-commit }}" `
            --control-commit "${{ needs.build.outputs.control-commit }}" `
            --prerelease true `
            --policy control/legal/release-policy.json `
            --asset-contract control/legal/release-assets-v2.json `
            --legal-payload release-bundle/assets/Youtube-Downloaderbs-v1.3.0-rc.1-legal.zip `
            --source-assets-root release-bundle/assets `
            --require-release-ready true
          if ($LASTEXITCODE -ne 0) {
              throw "release bundle is not approved for publishing"
          }
      - name: Confirm release absence immediately before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.3.0-rc.1"
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
              $PSNativeCommandUseErrorActionPreference = $false
              $output = @(& gh release view $tag --repo "${{ github.repository }}" 2>&1)
              $exitCode = $LASTEXITCODE
          }
          finally {
              $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }
          if ($exitCode -eq 0) {
              throw "GitHub release $tag already exists"
          }
          $text = ($output | Out-String).Trim()
          if ($exitCode -ne 1 -or $text -notmatch "(?i)(release\s+not\s+found|not\s+found|HTTP\s+404)") {
              throw "Could not unambiguously confirm that GitHub release $tag is absent"
          }
          Write-Host "Confirmed immediately before publishing: release $tag does not exist."
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.3.0-rc.1
          name: Youtube Downloaderbs v1.3.0-rc.1
          prerelease: true
          draft: false
          body_path: release-bundle/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-bundle/assets/Youtube.Downloaderbs.exe
            release-bundle/assets/Youtube-Downloaderbs-v1.3.0-rc.1.zip
