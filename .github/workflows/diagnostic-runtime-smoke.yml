name: Diagnostic runtime smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: diagnostic-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-diagnostic-contract:
    name: SHA marker and per-record JSONL flush
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify full source SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Actual = (git rev-parse HEAD).Trim()
          if ($Actual -cne $env:SOURCE_SHA) { throw "Checked-out source differs from SOURCE_SHA" }
          if ($env:SOURCE_SHA -cnotmatch "^[0-9a-f]{40}$") { throw "SOURCE_SHA must be full length" }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Verify marker gating and durable JSONL records
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/smoke_runtime_diagnostics.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime diagnostics smoke failed" }
