name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows compile, preflight and smoke
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload-release-bundle.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-release-bundle.outputs.artifact-digest }}

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Verify pinned Python version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $VersionOutput = (& python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "Could not query Python version"
          }
          if ($VersionOutput -ne "Python 3.11.9") {
              throw "Unexpected Python version: $VersionOutput"
          }

          Write-Host "Pinned Python verified: $VersionOutput"

      - name: Configure canonical Windows temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
              throw "Runner temporary root is unavailable"
          }

          $requestedTemp = Join-Path $env:RUNNER_TEMP "s9h-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $requestedTemp | Out-Null

          $resolvedOutput = @(
              & python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=False))" $requestedTemp
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve the canonical Windows temporary directory"
          }

          $resolvedTemp = $resolvedOutput | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace([string]$resolvedTemp)) {
              throw "Python returned an empty canonical temporary path"
          }

          $resolvedTemp = ([string]$resolvedTemp).Trim()
          New-Item -ItemType Directory -Force -Path $resolvedTemp | Out-Null

          $env:TEMP = $resolvedTemp
          $env:TMP = $resolvedTemp
          $env:TMPDIR = $resolvedTemp

          "TEMP=$resolvedTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$resolvedTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=$resolvedTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          with TemporaryDirectory() as temp_dir:
              raw_path = Path(temp_dir)
              canonical_path = raw_path.resolve(strict=False)
              if raw_path != canonical_path:
                  raise SystemExit("Configured temporary path is not canonical")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
              throw "Canonical temporary-path probe failed"
          }

      - name: Validate locked build dependencies
        shell: pwsh
        run: |
          python scripts/install_build_dependencies.py `
            --venv "$env:RUNNER_TEMP\s9h-build-lock-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --github-env "$env:GITHUB_ENV" `
            --github-path "$env:GITHUB_PATH"
          if ($LASTEXITCODE -ne 0) {
              throw "Locked build dependency validation failed"
          }

      - name: Compile Python sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          python -m compileall app.py core ui scripts
          if ($LASTEXITCODE -ne 0) {
              throw "Python source compilation failed"
          }

      - name: Run package preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          python scripts/package_windows.py --preflight-only
          if ($LASTEXITCODE -ne 0) {
              throw "Package preflight failed"
          }

      - name: Run tracked smoke suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $SmokeTests = @(
              git ls-files "scripts/smoke_*.py" |
                  Sort-Object
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Could not enumerate tracked smoke tests"
          }
          if ($SmokeTests.Count -eq 0) {
              throw "No tracked smoke tests were found"
          }

          $Passed = 0
          foreach ($Test in $SmokeTests) {
              Write-Host "RUN $Test"

              python $Test
              if ($LASTEXITCODE -ne 0) {
                  throw "Smoke test failed: $Test"
              }

              $Passed++
          }

          Write-Host "Smoke tests passed: $Passed/$($SmokeTests.Count)"

      - name: Create and verify synthetic release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $SyntheticRoot = Join-Path $env:RUNNER_TEMP "s9h-ci-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $ReleaseRoot = Join-Path $SyntheticRoot "release"
          $BundleRoot = Join-Path $SyntheticRoot "publish-bundle"
          $SourceAssetsRoot = Join-Path $SyntheticRoot "source-assets"
          $LegalPayload = Join-Path $ReleaseRoot "assets\Youtube-Downloaderbs-v0.0.0-ci-legal.zip"
          New-Item -ItemType Directory -Force -Path (Join-Path $ReleaseRoot "assets") | Out-Null
          New-Item -ItemType Directory -Force -Path $SourceAssetsRoot | Out-Null

          @'
          from pathlib import Path
          import hashlib
          import sys
          import zipfile

          release_root = Path(sys.argv[1])
          source_root = Path(sys.argv[2])
          assets = release_root / "assets"
          (assets / "Youtube.Downloaderbs.exe").write_bytes(
              b"MZ synthetic CI fixture; this file is not executable.\n"
          )
          archive = assets / "Youtube-Downloaderbs-v0.0.0-ci.zip"
          portable_entries = {
              "SYNTHETIC.txt": b"Synthetic CI release bundle fixture.\n",
              "Youtube.Downloaderbs.exe": b"MZ synthetic packaged application fixture.\n",
              "app.pyz": b"Synthetic packaged application archive.\n",
              "data/bin/aria2c.exe": b"MZ synthetic aria2 fixture.\n",
              "data/bin/deno.exe": b"MZ synthetic Deno fixture.\n",
              "data/bin/ffmpeg.exe": b"MZ synthetic FFmpeg fixture.\n",
              "data/bin/ffprobe.exe": b"MZ synthetic ffprobe fixture.\n",
              "data/bin/yt-dlp.exe": b"MZ synthetic yt-dlp fixture.\n",
              "native/_tkinter.pyd": b"MZ synthetic native extension fixture.\n",
              "packages/demo/__init__.py": b"VERSION = '1.0.0'\n",
              "python311.dll": b"MZ synthetic Python runtime fixture.\n",
          }
          with zipfile.ZipFile(archive, "w") as handle:
              for name, data in sorted(portable_entries.items()):
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  handle.writestr(info, data)

          source_notice = (
              b"synthetic fixture\n"
              b"not a real source kit\n"
              b"not for distribution\n"
          )
          source_manifest = (
              b'{"distribution_allowed":false,"fixture":"synthetic fixture",'
              b'"notice":"not a real source kit; not for distribution"}\n'
          )
          for component in ("aria2", "ffmpeg"):
              source_archive = (
                  source_root /
                  f"Youtube-Downloaderbs-v0.0.0-ci-{component}-source.zip"
              )
              with zipfile.ZipFile(source_archive, "w") as handle:
                  for name, data in (
                      ("SOURCE_MANIFEST.json", source_manifest),
                      ("SYNTHETIC_SOURCE_FIXTURE.txt", source_notice),
                  ):
                      source_info = zipfile.ZipInfo(
                          name,
                          date_time=(1980, 1, 1, 0, 0, 0),
                      )
                      source_info.compress_type = zipfile.ZIP_DEFLATED
                      source_info.create_system = 3
                      source_info.external_attr = 0o100644 << 16
                      handle.writestr(source_info, data)
          portable_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release_root / "RELEASE_NOTES.md").write_bytes(
              (
                  "# Synthetic CI release\n\n"
                  "Artifact handoff verification only.\n\n"
                  "## Build checksums\n\n"
                  f"- `Youtube.Downloaderbs.exe`: `{'a' * 64}`\n"
                  f"- `{archive.name}`: `{portable_hash}`\n"
              ).encode("ascii")
          )
          '@ | python - $ReleaseRoot $SourceAssetsRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release fixture creation failed"
          }

          $Commit = (git rev-parse HEAD).Trim()
          if ($Commit -cnotmatch "^[0-9a-f]{40}$") {
              throw "Current CI commit is invalid"
          }
          $SyntheticReleaseNotes = Join-Path $ReleaseRoot "RELEASE_NOTES.md"
          $SyntheticPortable = Join-Path $ReleaseRoot "assets\Youtube-Downloaderbs-v0.0.0-ci.zip"
          $PreInjectionHash = (Get-FileHash -LiteralPath $SyntheticPortable -Algorithm SHA256).Hash.ToLowerInvariant()

          python scripts/prepare_release_legal_payload.py create `
            --control-root . `
            --portable-zip $SyntheticPortable `
            --output-zip $LegalPayload `
            --release-notes $SyntheticReleaseNotes `
            --tag v0.0.0-ci `
            --source-commit $Commit `
            --control-commit $Commit
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release legal payload creation failed"
          }

          python scripts/prepare_release_legal_payload.py verify `
            --control-root . `
            --portable-zip $SyntheticPortable `
            --legal-zip $LegalPayload `
            --release-notes $SyntheticReleaseNotes `
            --tag v0.0.0-ci `
            --source-commit $Commit `
            --control-commit $Commit
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release legal payload verification failed"
          }
          $PostInjectionHash = (Get-FileHash -LiteralPath $SyntheticPortable -Algorithm SHA256).Hash.ToLowerInvariant()
          $SyntheticNotesText = [IO.File]::ReadAllText($SyntheticReleaseNotes)
          if ($PreInjectionHash -eq $PostInjectionHash) {
              throw "Synthetic portable ZIP checksum did not change after legal injection"
          }
          if (-not $SyntheticNotesText.Contains($PostInjectionHash) -or $SyntheticNotesText.Contains($PreInjectionHash)) {
              throw "Synthetic release notes checksum was not synchronized"
          }

          $SbomInput = Join-Path $SyntheticRoot "synthetic-release-sbom-input.json"
          python scripts/create_synthetic_release_sbom_input.py `
            --release-root $ReleaseRoot `
            --legal-payload $LegalPayload `
            --source-assets-root $SourceAssetsRoot `
            --tag v0.0.0-ci `
            --source-commit $Commit `
            --control-commit $Commit `
            --prerelease true `
            --policy legal/release-policy.json `
            --asset-contract legal/release-assets-v3.json `
            --output $SbomInput
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release SBOM evidence creation failed"
          }

          python scripts/prepare_release_bundle.py create `
            --release-root $ReleaseRoot `
            --bundle-root $BundleRoot `
            --tag v0.0.0-ci `
            --source-commit $Commit `
            --control-commit $Commit `
            --prerelease true `
            --policy legal/release-policy.json `
            --asset-contract legal/release-assets-v3.json `
            --legal-payload $LegalPayload `
            --source-assets-root $SourceAssetsRoot `
            --sbom-input $SbomInput
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release bundle creation failed"
          }

          python scripts/prepare_release_bundle.py verify `
            --bundle-root $BundleRoot `
            --tag v0.0.0-ci `
            --source-commit $Commit `
            --control-commit $Commit `
            --prerelease true `
            --policy legal/release-policy.json `
            --asset-contract legal/release-assets-v3.json `
            --legal-payload (Join-Path $BundleRoot "assets\Youtube-Downloaderbs-v0.0.0-ci-legal.zip") `
            --source-assets-root (Join-Path $BundleRoot "assets") `
            --sbom-input $SbomInput `
            --require-release-ready false
          if ($LASTEXITCODE -ne 0) {
              throw "Synthetic release bundle verification failed"
          }

          $PreviousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $PublishReadyOutput = @(
              & python scripts/prepare_release_bundle.py verify `
                --bundle-root $BundleRoot `
                --tag v0.0.0-ci `
                --source-commit $Commit `
                --control-commit $Commit `
                --prerelease true `
                --policy legal/release-policy.json `
                --asset-contract legal/release-assets-v3.json `
                --legal-payload (Join-Path $BundleRoot "assets\Youtube-Downloaderbs-v0.0.0-ci-legal.zip") `
                --source-assets-root (Join-Path $BundleRoot "assets") `
                --sbom-input $SbomInput `
                --require-release-ready true 2>&1
            )
            $PublishReadyExitCode = $LASTEXITCODE
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $PreviousNativePreference
          }
          if ($PublishReadyExitCode -ne 1 -or ($PublishReadyOutput | Out-String) -notmatch "release bundle is not approved for publishing") {
              throw "Synthetic publish-ready verification did not remain fail-closed"
          }
          Write-Host "Synthetic publish-ready rejection verified"
          $global:LASTEXITCODE = 0

      - name: Upload synthetic release bundle
        id: upload-release-bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s9h-ci-release-${{ github.run_id }}-${{ github.run_attempt }}/publish-bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 1

      - name: Report synthetic release bundle handoff
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload-release-bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-release-bundle.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_ID -notmatch "^[1-9][0-9]*$") {
              throw "Synthetic release bundle artifact ID is invalid"
          }
          if ($env:ARTIFACT_DIGEST -cnotmatch "^[0-9a-f]{64}$") {
              throw "Synthetic release bundle artifact digest is invalid"
          }
          Write-Host "Synthetic release bundle artifact ID: $env:ARTIFACT_ID"
          Write-Host "Synthetic release bundle artifact digest: $env:ARTIFACT_DIGEST"

  release-bundle-handoff:
    name: Release bundle artifact handoff
    needs: windows-smoke
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-2022

    steps:
      - name: Validate immutable synthetic bundle outputs
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ needs.windows-smoke.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.windows-smoke.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_ID -notmatch "^[1-9][0-9]*$") {
              throw "Synthetic release bundle artifact ID is invalid"
          }
          if ($env:ARTIFACT_DIGEST -cnotmatch "^[0-9a-f]{64}$") {
              throw "Synthetic release bundle artifact digest is invalid"
          }
          Write-Host "Synthetic release bundle artifact ID: $env:ARTIFACT_ID"
          Write-Host "Synthetic release bundle artifact digest: $env:ARTIFACT_DIGEST"

      - name: Download synthetic release bundle by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          artifact-ids: ${{ needs.windows-smoke.outputs.artifact-id }}
          path: artifact-download
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error

      - name: Extract and validate raw synthetic artifact archive
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ needs.windows-smoke.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          Add-Type -AssemblyName System.IO.Compression

          $MaxEntryCount = 128
          $MaxTotalUncompressedBytes = 16777216
          $SuccessMessage = "Secure raw synthetic artifact extraction verified"

          function Assert-BelowRoot(
              [string]$Root,
              [string]$Candidate,
              [string]$Label
          ) {
              $trimChars = [char[]]@(
                  [IO.Path]::DirectorySeparatorChar,
                  [IO.Path]::AltDirectorySeparatorChar
              )
              $prefix = $Root.TrimEnd($trimChars) + [IO.Path]::DirectorySeparatorChar
              if (-not $Candidate.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "$Label escaped its required root"
              }
          }

          function Assert-WindowsSafePathSegment(
              [Parameter(Mandatory = $true)]
              [string]$Segment
          ) {
              if (
                  [string]::IsNullOrEmpty($Segment) -or
                  $Segment -ceq "." -or
                  $Segment -ceq ".." -or
                  $Segment.Contains("/")
              ) {
                  throw "Raw artifact ZIP contains an unsafe Windows path segment"
              }
              if ($Segment.EndsWith(".", [StringComparison]::Ordinal)) {
                  throw "Raw artifact ZIP path segment ends with an ASCII dot"
              }
              if ($Segment.EndsWith(" ", [StringComparison]::Ordinal)) {
                  throw "Raw artifact ZIP path segment ends with an ASCII space"
              }
              if ($Segment.IndexOfAny('<>:"\|?*'.ToCharArray()) -ge 0) {
                  throw "Raw artifact ZIP path segment contains a forbidden Windows character"
              }
              foreach ($character in $Segment.ToCharArray()) {
                  if ([int]$character -le 0x1F) {
                      throw "Raw artifact ZIP path segment contains an ASCII control character"
                  }
              }

              $firstPeriod = $Segment.IndexOf([char]46)
              $deviceBase = if ($firstPeriod -ge 0) {
                  $Segment.Substring(0, $firstPeriod)
              } else {
                  $Segment
              }
              $deviceBaseForComparison = $deviceBase.TrimEnd(
                  [char[]]@([char]46, [char]32)
              )
              if ($WindowsReservedDeviceBasenames.Contains($deviceBaseForComparison)) {
                  throw "Raw artifact ZIP path segment uses a reserved Windows device basename"
              }
          }

          $WindowsReservedDeviceBasenames = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
          )
          foreach ($reservedDeviceName in @(
              "CON", "PRN", "AUX", "NUL",
              "COM1", "COM2", "COM3", "COM4", "COM5", "COM6", "COM7", "COM8", "COM9",
              "LPT1", "LPT2", "LPT3", "LPT4", "LPT5", "LPT6", "LPT7", "LPT8", "LPT9",
              ("COM" + [char]0x00B9), ("COM" + [char]0x00B2), ("COM" + [char]0x00B3),
              ("LPT" + [char]0x00B9), ("LPT" + [char]0x00B2), ("LPT" + [char]0x00B3),
              "CONIN$", "CONOUT$"
          )) {
              if (-not $WindowsReservedDeviceBasenames.Add($reservedDeviceName)) {
                  throw "Windows reserved device-name contract contains a duplicate"
              }
          }
          if ($WindowsReservedDeviceBasenames.Count -ne 30) {
              throw "Windows reserved device-name contract is incomplete"
          }

          function Get-RawZipEntryNames(
              [string]$ArchivePath,
              [int]$EntryLimit
          ) {
              $stream = $null
              $reader = $null
              try {
                  $stream = [IO.File]::Open(
                      $ArchivePath,
                      [IO.FileMode]::Open,
                      [IO.FileAccess]::Read,
                      [IO.FileShare]::Read
                  )
                  if ($stream.Length -lt 22) {
                      throw "Raw artifact ZIP is too short"
                  }
                  $tailLength = [int][Math]::Min([int64]65557, $stream.Length)
                  $tail = New-Object byte[] $tailLength
                  $stream.Position = $stream.Length - $tailLength
                  $tailRead = $stream.Read($tail, 0, $tail.Length)
                  if ($tailRead -ne $tail.Length) {
                      throw "Raw artifact ZIP tail could not be read"
                  }

                  $eocdIndex = -1
                  for ($index = $tail.Length - 22; $index -ge 0; $index--) {
                      if (
                          $tail[$index] -eq 0x50 -and
                          $tail[$index + 1] -eq 0x4B -and
                          $tail[$index + 2] -eq 0x05 -and
                          $tail[$index + 3] -eq 0x06
                      ) {
                          $commentLength = [BitConverter]::ToUInt16($tail, $index + 20)
                          if ($index + 22 + $commentLength -eq $tail.Length) {
                              $eocdIndex = $index
                              break
                          }
                      }
                  }
                  if ($eocdIndex -lt 0) {
                      throw "Raw artifact ZIP end record is invalid"
                  }

                  $diskNumber = [BitConverter]::ToUInt16($tail, $eocdIndex + 4)
                  $centralDisk = [BitConverter]::ToUInt16($tail, $eocdIndex + 6)
                  $entriesOnDisk = [BitConverter]::ToUInt16($tail, $eocdIndex + 8)
                  $entryCount = [BitConverter]::ToUInt16($tail, $eocdIndex + 10)
                  $centralSize = [BitConverter]::ToUInt32($tail, $eocdIndex + 12)
                  $centralOffset = [BitConverter]::ToUInt32($tail, $eocdIndex + 16)
                  if (
                      $diskNumber -ne 0 -or
                      $centralDisk -ne 0 -or
                      $entriesOnDisk -ne $entryCount -or
                      $entryCount -eq 0xFFFF -or
                      $centralSize -eq 0xFFFFFFFF -or
                      $centralOffset -eq 0xFFFFFFFF
                  ) {
                      throw "Raw artifact ZIP uses unsupported multi-disk or ZIP64 metadata"
                  }
                  if ($entryCount -gt $EntryLimit) {
                      throw "Raw artifact ZIP exceeds the entry-count limit"
                  }
                  $eocdOffset = $stream.Length - $tail.Length + $eocdIndex
                  [int64]$centralEnd = [int64]$centralOffset + [int64]$centralSize
                  if (
                      $centralEnd -ne $eocdOffset -or
                      $centralEnd -gt $stream.Length
                  ) {
                      throw "Raw artifact ZIP central directory bounds are invalid"
                  }

                  $stream.Position = $centralOffset
                  $reader = [IO.BinaryReader]::new(
                      $stream,
                      [Text.UTF8Encoding]::new($false, $true),
                      $true
                  )
                  $utf8 = [Text.UTF8Encoding]::new($false, $true)
                  $names = [Collections.Generic.List[string]]::new()
                  for ($entryIndex = 0; $entryIndex -lt $entryCount; $entryIndex++) {
                      if ($reader.ReadUInt32() -ne 0x02014B50) {
                          throw "Raw artifact ZIP central directory signature is invalid"
                      }
                      $reader.ReadUInt16() | Out-Null
                      $reader.ReadUInt16() | Out-Null
                      $flags = $reader.ReadUInt16()
                      $reader.ReadUInt16() | Out-Null
                      $reader.ReadUInt16() | Out-Null
                      $reader.ReadUInt16() | Out-Null
                      $reader.ReadUInt32() | Out-Null
                      $reader.ReadUInt32() | Out-Null
                      $reader.ReadUInt32() | Out-Null
                      $nameLength = $reader.ReadUInt16()
                      $extraLength = $reader.ReadUInt16()
                      $entryCommentLength = $reader.ReadUInt16()
                      $entryDisk = $reader.ReadUInt16()
                      $reader.ReadUInt16() | Out-Null
                      $reader.ReadUInt32() | Out-Null
                      $localOffset = $reader.ReadUInt32()
                      if (
                          $entryDisk -ne 0 -or
                          $localOffset -eq 0xFFFFFFFF -or
                          $localOffset -ge $centralOffset
                      ) {
                          throw "Raw artifact ZIP entry metadata is invalid"
                      }
                      $nameBytes = $reader.ReadBytes($nameLength)
                      if ($nameBytes.Length -ne $nameLength) {
                          throw "Raw artifact ZIP entry name is truncated"
                      }
                      if (
                          @($nameBytes | Where-Object { $_ -eq 0x00 -or $_ -eq 0x5C }).Count -ne 0
                      ) {
                          throw "Raw artifact ZIP contains a raw NUL or backslash entry name"
                      }
                      if (($flags -band 0x0001) -ne 0) {
                          throw "Raw artifact ZIP contains an encrypted entry"
                      }
                      try {
                          $rawName = $utf8.GetString($nameBytes)
                      } catch {
                          throw "Raw artifact ZIP entry name is not valid UTF-8"
                      }
                      $names.Add($rawName)
                      if ($extraLength -gt 0) {
                          $reader.ReadBytes($extraLength) | Out-Null
                      }
                      if ($entryCommentLength -gt 0) {
                          $reader.ReadBytes($entryCommentLength) | Out-Null
                      }
                  }
                  if ($stream.Position -ne $centralEnd) {
                      throw "Raw artifact ZIP central directory size is invalid"
                  }
                  return @($names)
              } finally {
                  if ($null -ne $reader) {
                      $reader.Dispose()
                  }
                  if ($null -ne $stream) {
                      $stream.Dispose()
                  }
              }
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $rawRoot = [IO.Path]::GetFullPath((Join-Path $workspace "artifact-download"))
          $destinationRoot = [IO.Path]::GetFullPath((Join-Path $workspace "release-bundle"))
          Assert-BelowRoot $workspace $rawRoot "Raw artifact root"
          Assert-BelowRoot $workspace $destinationRoot "Release bundle root"

          if (-not [IO.Directory]::Exists($rawRoot)) {
              throw "Raw artifact root is missing"
          }
          if ([IO.Directory]::Exists($destinationRoot) -or [IO.File]::Exists($destinationRoot)) {
              throw "Release bundle destination already exists"
          }
          $rawRootItem = Get-Item -LiteralPath $rawRoot -Force
          if (
              -not $rawRootItem.PSIsContainer -or
              ($rawRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
              throw "Raw artifact root is not a regular directory"
          }

          $rawItems = @(Get-ChildItem -LiteralPath $rawRoot -Force -Recurse)
          $rawDirectories = @($rawItems | Where-Object { $_.PSIsContainer })
          $rawFiles = @($rawItems | Where-Object { -not $_.PSIsContainer })
          $rawReparsePoints = @(
              $rawItems | Where-Object {
                  ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              }
          )
          if (
              $rawFiles.Count -ne 1 -or
              $rawDirectories.Count -ne 0 -or
              $rawReparsePoints.Count -ne 0
          ) {
              throw "Raw artifact root must contain exactly one regular file and no subdirectories"
          }
          $rawArchive = $rawFiles[0]
          if (
              ($rawArchive.Attributes -band [IO.FileAttributes]::Directory) -ne 0 -or
              ($rawArchive.Attributes -band [IO.FileAttributes]::Device) -ne 0 -or
              ($rawArchive.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
              throw "Raw artifact archive is not a regular file"
          }

          if ($env:ARTIFACT_DIGEST -cnotmatch "^[0-9a-f]{64}$") {
              throw "Raw artifact digest is invalid"
          }
          $actualDigest = (
              Get-FileHash -LiteralPath $rawArchive.FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualDigest -cne $env:ARTIFACT_DIGEST) {
              throw "Raw artifact digest does not match the immutable producer output"
          }
          $rawEntryNames = @(
              Get-RawZipEntryNames $rawArchive.FullName $MaxEntryCount
          )

          $archiveStream = $null
          $archive = $null
          $destinationCreated = $false
          try {
              $archiveStream = [IO.File]::Open(
                  $rawArchive.FullName,
                  [IO.FileMode]::Open,
                  [IO.FileAccess]::Read,
                  [IO.FileShare]::Read
              )
              $archive = [IO.Compression.ZipArchive]::new(
                  $archiveStream,
                  [IO.Compression.ZipArchiveMode]::Read,
                  $false
              )
              $entries = @($archive.Entries)
              if ($entries.Count -gt $MaxEntryCount) {
                  throw "Raw artifact ZIP exceeds the entry-count limit"
              }
              if ($entries.Count -ne $rawEntryNames.Count) {
                  throw "Raw artifact ZIP entry inventory does not match its central directory"
              }

              $exactPaths = [Collections.Generic.HashSet[string]]::new(
                  [StringComparer]::Ordinal
              )
              $caseInsensitivePaths = [Collections.Generic.HashSet[string]]::new(
                  [StringComparer]::OrdinalIgnoreCase
              )
              $pathKinds = [Collections.Generic.Dictionary[string, string]]::new(
                  [StringComparer]::OrdinalIgnoreCase
              )
              $resolvedTargetPaths = [Collections.Generic.HashSet[string]]::new(
                  [StringComparer]::OrdinalIgnoreCase
              )
              $plans = [Collections.Generic.List[object]]::new()
              [int64]$declaredTotal = 0

              for ($entryIndex = 0; $entryIndex -lt $entries.Count; $entryIndex++) {
                  $entry = $entries[$entryIndex]
                  $entryName = [string]$rawEntryNames[$entryIndex]
                  if ($entryName -cne [string]$entry.FullName) {
                      throw "Raw artifact ZIP entry name was normalized by the runtime"
                  }
                  if ([string]::IsNullOrEmpty($entryName)) {
                      throw "Raw artifact ZIP contains an empty entry name"
                  }
                  if (
                      $entryName.IndexOf([char]0) -ge 0 -or
                      $entryName.Contains("\") -or
                      $entryName.Contains(":") -or
                      $entryName.StartsWith("/") -or
                      [IO.Path]::IsPathRooted($entryName)
                  ) {
                      throw "Raw artifact ZIP contains an unsafe entry name"
                  }

                  $isDirectory = $entryName.EndsWith("/")
                  $logicalName = if ($isDirectory) {
                      $entryName.Substring(0, $entryName.Length - 1)
                  } else {
                      $entryName
                  }
                  if ([string]::IsNullOrEmpty($logicalName)) {
                      throw "Raw artifact ZIP contains an empty entry path"
                  }
                  $segments = @($logicalName.Split([char]"/"))
                  if (
                      @($segments | Where-Object { $_.Length -eq 0 }).Count -ne 0 -or
                      @($segments | Where-Object { $_ -ceq "." -or $_ -ceq ".." }).Count -ne 0
                  ) {
                      throw "Raw artifact ZIP contains an unsafe path segment"
                  }
                  foreach ($segment in $segments) {
                      Assert-WindowsSafePathSegment $segment
                  }
                  $normalizedPath = $segments -join "/"
                  if (-not $exactPaths.Add($normalizedPath)) {
                      throw "Raw artifact ZIP contains an exact duplicate path"
                  }
                  if (-not $caseInsensitivePaths.Add($normalizedPath)) {
                      throw "Raw artifact ZIP contains a case-insensitive duplicate path"
                  }

                  $externalAttributes = [BitConverter]::ToUInt32(
                      [BitConverter]::GetBytes([int32]$entry.ExternalAttributes),
                      0
                  )
                  $unixFileType = ($externalAttributes -shr 16) -band 0xF000
                  if ($unixFileType -eq 0xA000) {
                      throw "Raw artifact ZIP contains a UNIX symbolic-link entry"
                  }
                  if ($isDirectory -and [int64]$entry.Length -ne 0) {
                      throw "Raw artifact ZIP directory entry contains data"
                  }

                  $declaredTotal += [int64]$entry.Length
                  if ($declaredTotal -gt $MaxTotalUncompressedBytes) {
                      throw "Raw artifact ZIP exceeds the uncompressed-size limit"
                  }
                  $targetPath = [IO.Path]::GetFullPath(
                      (Join-Path $destinationRoot $normalizedPath.Replace(
                          [char]"/",
                          [IO.Path]::DirectorySeparatorChar
                      ))
                  )
                  Assert-BelowRoot $destinationRoot $targetPath "Raw artifact ZIP entry"
                  if (-not $resolvedTargetPaths.Add($targetPath)) {
                      throw "Raw artifact ZIP entries resolve to a duplicate Windows destination"
                  }
                  $kind = if ($isDirectory) { "directory" } else { "file" }
                  $pathKinds.Add($normalizedPath, $kind)
                  $plans.Add([PSCustomObject]@{
                      Entry = $entry
                      IsDirectory = $isDirectory
                      NormalizedPath = $normalizedPath
                      TargetPath = $targetPath
                  })
              }

              foreach ($plan in $plans) {
                  $segments = @($plan.NormalizedPath.Split([char]"/"))
                  for ($index = 1; $index -lt $segments.Count; $index++) {
                      $parentPath = $segments[0..($index - 1)] -join "/"
                      if (
                          $pathKinds.ContainsKey($parentPath) -and
                          $pathKinds[$parentPath] -ceq "file"
                      ) {
                          throw "Raw artifact ZIP writes through a file path"
                      }
                  }
                  if (-not $plan.IsDirectory) {
                      $childPrefix = $plan.NormalizedPath + "/"
                      foreach ($candidate in $pathKinds.Keys) {
                          if (
                              $candidate.StartsWith(
                                  $childPrefix,
                                  [StringComparison]::OrdinalIgnoreCase
                              )
                          ) {
                              throw "Raw artifact ZIP writes through a file path"
                          }
                      }
                  }
              }

              [IO.Directory]::CreateDirectory($destinationRoot) | Out-Null
              $destinationCreated = $true
              $destinationItem = Get-Item -LiteralPath $destinationRoot -Force
              if (
                  ($destinationItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              ) {
                  throw "Release bundle destination is a reparse point"
              }

              function Ensure-SafeDirectory([string]$DirectoryPath) {
                  if ($DirectoryPath -cne $destinationRoot) {
                      Assert-BelowRoot $destinationRoot $DirectoryPath "Extraction directory"
                  }
                  $relative = $DirectoryPath.Substring($destinationRoot.Length).TrimStart(
                      [char[]]@(
                          [IO.Path]::DirectorySeparatorChar,
                          [IO.Path]::AltDirectorySeparatorChar
                      )
                  )
                  $current = $destinationRoot
                  if (-not [string]::IsNullOrEmpty($relative)) {
                      foreach ($segment in $relative.Split([IO.Path]::DirectorySeparatorChar)) {
                          $current = Join-Path $current $segment
                          if ([IO.File]::Exists($current)) {
                              throw "Extraction directory writes through an existing file"
                          }
                          if (-not [IO.Directory]::Exists($current)) {
                              [IO.Directory]::CreateDirectory($current) | Out-Null
                          }
                          $currentItem = Get-Item -LiteralPath $current -Force
                          if (
                              ($currentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
                          ) {
                              throw "Extraction directory is a reparse point"
                          }
                      }
                  }
              }

              [int64]$actualTotal = 0
              foreach ($plan in $plans) {
                  if ($plan.IsDirectory) {
                      Ensure-SafeDirectory $plan.TargetPath
                      continue
                  }
                  $parentDirectory = [IO.Path]::GetDirectoryName($plan.TargetPath)
                  Ensure-SafeDirectory $parentDirectory
                  if (
                      [IO.File]::Exists($plan.TargetPath) -or
                      [IO.Directory]::Exists($plan.TargetPath)
                  ) {
                      throw "Extraction target already exists"
                  }

                  $inputStream = $null
                  $outputStream = $null
                  [int64]$entryBytes = 0
                  try {
                      $inputStream = $plan.Entry.Open()
                      $outputStream = [IO.File]::Open(
                          $plan.TargetPath,
                          [IO.FileMode]::CreateNew,
                          [IO.FileAccess]::Write,
                          [IO.FileShare]::None
                      )
                      $buffer = New-Object byte[] 81920
                      while (($bytesRead = $inputStream.Read($buffer, 0, $buffer.Length)) -gt 0) {
                          $entryBytes += $bytesRead
                          $actualTotal += $bytesRead
                          if ($actualTotal -gt $MaxTotalUncompressedBytes) {
                              throw "Raw artifact extraction exceeds the actual-size limit"
                          }
                          $outputStream.Write($buffer, 0, $bytesRead)
                      }
                  } finally {
                      if ($null -ne $outputStream) {
                          $outputStream.Dispose()
                      }
                      if ($null -ne $inputStream) {
                          $inputStream.Dispose()
                      }
                  }
                  if ($entryBytes -ne [int64]$plan.Entry.Length) {
                      throw "Raw artifact ZIP entry size changed during extraction"
                  }
              }
          } catch {
              if ($destinationCreated -and [IO.Directory]::Exists($destinationRoot)) {
                  try {
                      [IO.Directory]::Delete($destinationRoot, $true)
                  } catch {
                      Write-Error "Failed to clean an incomplete release bundle"
                  }
              }
              throw
          } finally {
              if ($null -ne $archive) {
                  $archive.Dispose()
              }
              if ($null -ne $archiveStream) {
                  $archiveStream.Dispose()
              }
          }

          if (-not [IO.Directory]::Exists($destinationRoot)) {
              throw "Release bundle destination was not created"
          }
          $extractedItems = @(Get-ChildItem -LiteralPath $destinationRoot -Force -Recurse)
          if (
              @(
                  $extractedItems | Where-Object {
                      ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
                  }
              ).Count -ne 0
          ) {
              throw "Release bundle contains a reparse point after extraction"
          }

          [IO.Directory]::Delete($rawRoot, $true)
          if ([IO.Directory]::Exists($rawRoot) -or [IO.File]::Exists($rawRoot)) {
              throw "Raw artifact root was not removed after extraction"
          }
          Write-Host $SuccessMessage

      - name: Verify synthetic release bundle handoff
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ZIP: Youtube-Downloaderbs-v0.0.0-ci.zip
          EXPECTED_LEGAL: Youtube-Downloaderbs-v0.0.0-ci-legal.zip
          EXPECTED_ARIA2_SOURCE: Youtube-Downloaderbs-v0.0.0-ci-aria2-source.zip
          EXPECTED_FFMPEG_SOURCE: Youtube-Downloaderbs-v0.0.0-ci-ffmpeg-source.zip
          EXPECTED_SBOM: Youtube-Downloaderbs-v0.0.0-ci.spdx.json
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          function Assert-ExactKeys($Value, [string[]]$Expected, [string]$Label) {
              $actual = @($Value.PSObject.Properties.Name | Sort-Object)
              $wanted = @($Expected | Sort-Object)
              if (@(Compare-Object $actual $wanted).Count -ne 0) {
                  throw "$Label fields are invalid"
              }
          }

          function Assert-Record($Record, [string]$ExpectedName, [string]$Path) {
              Assert-ExactKeys $Record @("name", "sha256", "size") $ExpectedName
              if ($Record.name -cne $ExpectedName) {
                  throw "$ExpectedName record name is invalid"
              }
              if ([int64]$Record.size -le 0) {
                  throw "$ExpectedName record size is invalid"
              }
              if ([string]$Record.sha256 -cnotmatch "^[0-9a-f]{64}$") {
                  throw "$ExpectedName record digest is invalid"
              }
              $item = Get-Item -LiteralPath $Path
              if ($item.Length -ne [int64]$Record.size) {
                  throw "$ExpectedName size does not match"
              }
              $digest = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cne [string]$Record.sha256) {
                  throw "$ExpectedName digest does not match"
              }
          }

          function Assert-AssetRecord($Record, [string]$ExpectedName, [string]$ExpectedRole, [string]$Path) {
              Assert-ExactKeys $Record @("name", "role", "sha256", "size") $ExpectedName
              if ($Record.role -cne $ExpectedRole) {
                  throw "$ExpectedName role is invalid"
              }
              $fileRecord = [PSCustomObject]@{
                  name = $Record.name
                  sha256 = $Record.sha256
                  size = $Record.size
              }
              Assert-Record $fileRecord $ExpectedName $Path
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $bundle = [IO.Path]::GetFullPath((Join-Path $workspace "release-bundle"))
          if (-not $bundle.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Release bundle escaped the workspace"
          }
          $rootItem = Get-Item -LiteralPath $bundle
          if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Release bundle root is a reparse point"
          }
          $items = @(Get-ChildItem -LiteralPath $bundle -Force -Recurse)
          if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -ne 0) {
              throw "Release bundle contains a reparse point"
          }
          $directories = @($items | Where-Object { $_.PSIsContainer })
          $files = @($items | Where-Object { -not $_.PSIsContainer })
          if ($directories.Count -ne 1 -or $directories[0].FullName -ne (Join-Path $bundle "assets")) {
              throw "Release bundle directory layout is invalid"
          }
          $relativeFiles = @($files | ForEach-Object { $_.FullName.Substring($bundle.Length + 1).Replace("\", "/") } | Sort-Object)
          $expectedFiles = @(
              "RELEASE_MANIFEST.json",
              "RELEASE_NOTES.md",
              "assets/SHA256SUMS.txt",
              "assets/Youtube.Downloaderbs.exe",
              "assets/$env:EXPECTED_ZIP",
              "assets/$env:EXPECTED_LEGAL",
              "assets/$env:EXPECTED_ARIA2_SOURCE",
              "assets/$env:EXPECTED_FFMPEG_SOURCE",
              "assets/$env:EXPECTED_SBOM"
          ) | Sort-Object
          if (@(Compare-Object $relativeFiles $expectedFiles).Count -ne 0) {
              throw "Release bundle file layout is invalid"
          }

          $manifest = Get-Content -LiteralPath (Join-Path $bundle "RELEASE_MANIFEST.json") -Raw | ConvertFrom-Json
          Assert-ExactKeys $manifest @(
              "assets", "bundle_format", "checksum_file", "control_commit",
              "legal_compliance_certified", "prerelease", "release_blockers",
              "release_notes", "release_ready", "release_tag", "schema_version",
              "source_availability_certified", "source_commit"
          ) "Release manifest"
          if ([int]$manifest.schema_version -ne 3 -or $manifest.bundle_format -cne "s9h-release-bundle-v3") {
              throw "Release manifest contract is invalid"
          }
          if ($manifest.release_tag -cne "v0.0.0-ci" -or -not [bool]$manifest.prerelease) {
              throw "Release manifest identity is invalid"
          }
          if ($manifest.source_commit -cne $env:EXPECTED_COMMIT -or $manifest.control_commit -cne $env:EXPECTED_COMMIT) {
              throw "Release manifest commit metadata is invalid"
          }
          if ([bool]$manifest.release_ready -or [bool]$manifest.legal_compliance_certified -or [bool]$manifest.source_availability_certified) {
              throw "Synthetic release bundle readiness is invalid"
          }
          if (@($manifest.release_blockers).Count -le 0) {
              throw "Synthetic release bundle blockers are missing"
          }
          $assets = @($manifest.assets)
          if ($assets.Count -ne 6) {
              throw "Release manifest asset count is invalid"
          }
          $expectedRoles = @{}
          $expectedRoles["Youtube.Downloaderbs.exe"] = "application-executable"
          $expectedRoles[$env:EXPECTED_ZIP] = "portable-package"
          $expectedRoles[$env:EXPECTED_LEGAL] = "legal-payload"
          $expectedRoles[$env:EXPECTED_ARIA2_SOURCE] = "aria2-source"
          $expectedRoles[$env:EXPECTED_FFMPEG_SOURCE] = "ffmpeg-source"
          $expectedRoles[$env:EXPECTED_SBOM] = "release-sbom"
          $expectedAssetNames = @($expectedRoles.Keys | Sort-Object)
          $assetNames = @($assets | ForEach-Object { [string]$_.name })
          if (@(Compare-Object $assetNames $expectedAssetNames -SyncWindow 0).Count -ne 0) {
              throw "Release manifest assets are not exact and sorted"
          }
          foreach ($asset in $assets) {
              Assert-AssetRecord $asset ([string]$asset.name) $expectedRoles[[string]$asset.name] (Join-Path $bundle "assets\$($asset.name)")
          }
          Assert-Record $manifest.checksum_file "SHA256SUMS.txt" (Join-Path $bundle "assets\SHA256SUMS.txt")
          Assert-Record $manifest.release_notes "RELEASE_NOTES.md" (Join-Path $bundle "RELEASE_NOTES.md")

          $checksumBytes = [IO.File]::ReadAllBytes((Join-Path $bundle "assets\SHA256SUMS.txt"))
          if ($checksumBytes.Length -ge 3 -and $checksumBytes[0] -eq 0xEF -and $checksumBytes[1] -eq 0xBB -and $checksumBytes[2] -eq 0xBF) {
              throw "Checksum file contains a BOM"
          }
          $checksumText = [Text.UTF8Encoding]::new($false, $true).GetString($checksumBytes)
          if ($checksumText.Contains("`r") -or -not $checksumText.EndsWith("`n") -or $checksumText.EndsWith("`n`n")) {
              throw "Checksum file line endings are invalid"
          }
          $checksumLines = @($checksumText.TrimEnd("`n").Split("`n"))
          $expectedChecksumLines = @($assets | Sort-Object name | ForEach-Object { "$($_.sha256)  $($_.name)" })
          if ($checksumLines.Count -ne 6 -or @(Compare-Object $checksumLines $expectedChecksumLines -SyncWindow 0).Count -ne 0) {
              throw "Checksum file content is invalid"
          }
          if ((Get-Item -LiteralPath (Join-Path $bundle "assets\Youtube.Downloaderbs.exe")).Length -le 0) {
              throw "Synthetic EXE fixture is empty"
          }
          if ((Get-Item -LiteralPath (Join-Path $bundle "assets\$env:EXPECTED_ZIP")).Length -le 0) {
              throw "Synthetic ZIP fixture is empty"
          }
          foreach ($requiredArchive in @($env:EXPECTED_LEGAL, $env:EXPECTED_ARIA2_SOURCE, $env:EXPECTED_FFMPEG_SOURCE)) {
              if ((Get-Item -LiteralPath (Join-Path $bundle "assets\$requiredArchive")).Length -le 0) {
                  throw "Synthetic required archive is empty: $requiredArchive"
              }
          }
          Write-Host "Synthetic release bundle v3 handoff verified"

      - name: Report fork pull request attestation skip
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: pwsh
        run: |
          Write-Host "Synthetic attestation steps are skipped for fork pull requests."

      - name: Validate synthetic attestation subjects
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          function Assert-BelowRoot(
              [string]$Root,
              [string]$Candidate,
              [string]$Label
          ) {
              $separator = [IO.Path]::DirectorySeparatorChar
              $prefix = $Root.TrimEnd($separator) + $separator
              if (-not $Candidate.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "$Label escaped the verified release bundle"
              }
          }

          $bundle = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "release-bundle"))
          $assets = [IO.Path]::GetFullPath((Join-Path $bundle "assets"))
          Assert-BelowRoot $bundle $assets "Synthetic asset root"

          $ExpectedSubjects = @(
              "Youtube.Downloaderbs.exe",
              "Youtube-Downloaderbs-v0.0.0-ci.zip",
              "Youtube-Downloaderbs-v0.0.0-ci-legal.zip",
              "Youtube-Downloaderbs-v0.0.0-ci.spdx.json",
              "SHA256SUMS.txt",
              "RELEASE_MANIFEST.json"
          )
          $subjectPaths = [ordered]@{
              "Youtube.Downloaderbs.exe" = Join-Path $assets "Youtube.Downloaderbs.exe"
              "Youtube-Downloaderbs-v0.0.0-ci.zip" = Join-Path $assets "Youtube-Downloaderbs-v0.0.0-ci.zip"
              "Youtube-Downloaderbs-v0.0.0-ci-legal.zip" = Join-Path $assets "Youtube-Downloaderbs-v0.0.0-ci-legal.zip"
              "Youtube-Downloaderbs-v0.0.0-ci.spdx.json" = Join-Path $assets "Youtube-Downloaderbs-v0.0.0-ci.spdx.json"
              "SHA256SUMS.txt" = Join-Path $assets "SHA256SUMS.txt"
              "RELEASE_MANIFEST.json" = Join-Path $bundle "RELEASE_MANIFEST.json"
          }
          if (@(Compare-Object @($subjectPaths.Keys) $ExpectedSubjects -SyncWindow 0).Count -ne 0) {
              throw "Synthetic provenance subject set is not exact"
          }

          $attestationRoot = [IO.Path]::GetFullPath(
              (Join-Path $env:RUNNER_TEMP "s9h-ci-attestation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          )
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          Assert-BelowRoot $runnerTemp $attestationRoot "Synthetic attestation root"
          if ([IO.Directory]::Exists($attestationRoot)) {
              [IO.Directory]::Delete($attestationRoot, $true)
          }
          [IO.Directory]::CreateDirectory($attestationRoot) | Out-Null
          $checksumPath = Join-Path $attestationRoot "provenance-subjects.sha256"

          $rows = [Collections.Generic.List[string]]::new()
          foreach ($name in $ExpectedSubjects) {
              if ($name -cne [IO.Path]::GetFileName($name) -or $name.Contains("/") -or $name.Contains("\")) {
                  throw "Synthetic provenance subject name is unsafe"
              }
              $path = [IO.Path]::GetFullPath([string]$subjectPaths[$name])
              Assert-BelowRoot $bundle $path "Synthetic provenance subject"
              $item = Get-Item -LiteralPath $path
              if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw "Synthetic provenance subject is not a regular file"
              }
              $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -cnotmatch "^[0-9a-f]{64}$") {
                  throw "Synthetic provenance subject digest is malformed"
              }
              $rows.Add("$digest  $name")
          }
          [IO.File]::WriteAllText(
              $checksumPath,
              (($rows -join "`n") + "`n"),
              [Text.UTF8Encoding]::new($false)
          )

          $checksumBytes = [IO.File]::ReadAllBytes($checksumPath)
          $checksumText = [Text.UTF8Encoding]::new($false, $true).GetString($checksumBytes)
          if ($checksumText.Contains("`r") -or -not $checksumText.EndsWith("`n") -or $checksumText.EndsWith("`n`n")) {
              throw "Synthetic provenance checksum file encoding is invalid"
          }
          $records = @($checksumText.TrimEnd("`n").Split("`n"))
          if ($records.Count -ne $ExpectedSubjects.Count) {
              throw "Synthetic provenance checksum record count is invalid"
          }
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($record in $records) {
              if ($record -cnotmatch "^([0-9a-f]{64})  ([^/\\]+)$") {
                  throw "Synthetic provenance checksum record is malformed"
              }
              $recordDigest = $Matches[1]
              $recordName = $Matches[2]
              if (-not $seen.Add($recordName) -or $recordName -cnotin $ExpectedSubjects) {
                  throw "Synthetic provenance checksum subject is duplicate or unexpected"
              }
              $actualDigest = (
                  Get-FileHash -LiteralPath ([string]$subjectPaths[$recordName]) -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ($recordDigest -cne $actualDigest) {
                  throw "Synthetic provenance checksum record describes stale bytes"
              }
          }
          if (@(Compare-Object @($seen) $ExpectedSubjects).Count -ne 0) {
              throw "Synthetic provenance checksum subjects are incomplete"
          }
          Write-Host "Synthetic attestation subject contract verified"

      - name: Attest synthetic provenance
        id: attest-provenance
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/s9h-ci-attestation-${{ github.run_id }}-${{ github.run_attempt }}/provenance-subjects.sha256
          create-storage-record: false
          show-summary: false

      - name: Attest synthetic SBOM
        id: attest-sbom
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ github.workspace }}/release-bundle/assets/Youtube-Downloaderbs-v0.0.0-ci.zip
          sbom-path: ${{ github.workspace }}/release-bundle/assets/Youtube-Downloaderbs-v0.0.0-ci.spdx.json
          create-storage-record: false
          show-summary: false

      - name: Verify synthetic attestations online
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $version = (& gh --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI version could not be read"
          }
          Write-Host "GitHub CLI used for synthetic attestation verification: $version"
          $help = (& gh attestation verify --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $help -notmatch "--predicate-type" -or
              $help -notmatch "--source-digest" -or
              $help -notmatch "--signer-workflow" -or
              $help -notmatch "--bundle" -or
              $help -notmatch "--custom-trusted-root") {
              throw "Preinstalled GitHub CLI lacks required attestation verification controls"
          }

          $repository = "sangbuidinh/s9h-YoutubeDownloader"
          $signerWorkflow = "sangbuidinh/s9h-YoutubeDownloader/.github/workflows/ci.yml"
          $bundle = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "release-bundle"))
          $provenanceSubjects = @(
              (Join-Path $bundle "assets\Youtube.Downloaderbs.exe"),
              (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.zip"),
              (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci-legal.zip"),
              (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.spdx.json"),
              (Join-Path $bundle "assets\SHA256SUMS.txt"),
              (Join-Path $bundle "RELEASE_MANIFEST.json")
          )
          foreach ($subject in $provenanceSubjects) {
              & gh attestation verify $subject `
                  --repo $repository `
                  --predicate-type "https://slsa.dev/provenance/v1" `
                  --source-digest $env:GITHUB_SHA `
                  --signer-workflow $signerWorkflow
              if ($LASTEXITCODE -ne 0) {
                  throw "Online synthetic provenance verification failed"
              }
          }
          $portable = Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.zip"
          & gh attestation verify $portable `
              --repo $repository `
              --predicate-type "https://spdx.dev/Document/v2.3" `
              --source-digest $env:GITHUB_SHA `
              --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) {
              throw "Online synthetic SBOM verification failed"
          }
          Write-Host "Online synthetic provenance and SBOM attestations verified"

      - name: Verify synthetic attestation bundles offline
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          foreach ($bundlePath in @($env:PROVENANCE_BUNDLE, $env:SBOM_BUNDLE)) {
              if ([string]::IsNullOrWhiteSpace($bundlePath) -or -not [IO.File]::Exists($bundlePath)) {
                  throw "Generated synthetic attestation bundle is missing"
              }
          }
          $attestationRoot = [IO.Path]::GetFullPath(
              (Join-Path $env:RUNNER_TEMP "s9h-ci-attestation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          )
          $trustedRootPath = Join-Path $attestationRoot "trusted_root.jsonl"
          $trustedRoot = (& gh attestation trusted-root 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($trustedRoot)) {
              throw "Official attestation trusted root could not be obtained"
          }
          [IO.File]::WriteAllText(
              $trustedRootPath,
              $trustedRoot,
              [Text.UTF8Encoding]::new($false)
          )

          $savedEnvironment = @{}
          foreach ($name in @("GH_TOKEN", "GITHUB_TOKEN", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY")) {
              $savedEnvironment[$name] = [Environment]::GetEnvironmentVariable($name)
          }
          try {
              [Environment]::SetEnvironmentVariable("GH_TOKEN", $null)
              [Environment]::SetEnvironmentVariable("GITHUB_TOKEN", $null)
              [Environment]::SetEnvironmentVariable("HTTP_PROXY", "http://127.0.0.1:9")
              [Environment]::SetEnvironmentVariable("HTTPS_PROXY", "http://127.0.0.1:9")
              [Environment]::SetEnvironmentVariable("ALL_PROXY", "http://127.0.0.1:9")
              [Environment]::SetEnvironmentVariable("NO_PROXY", "")

              $repository = "sangbuidinh/s9h-YoutubeDownloader"
              $signerWorkflow = "sangbuidinh/s9h-YoutubeDownloader/.github/workflows/ci.yml"
              $bundle = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "release-bundle"))
              $provenanceSubjects = @(
                  (Join-Path $bundle "assets\Youtube.Downloaderbs.exe"),
                  (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.zip"),
                  (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci-legal.zip"),
                  (Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.spdx.json"),
                  (Join-Path $bundle "assets\SHA256SUMS.txt"),
                  (Join-Path $bundle "RELEASE_MANIFEST.json")
              )
              foreach ($subject in $provenanceSubjects) {
                  & gh attestation verify $subject `
                      --repo $repository `
                      --bundle $env:PROVENANCE_BUNDLE `
                      --custom-trusted-root $trustedRootPath `
                      --predicate-type "https://slsa.dev/provenance/v1" `
                      --source-digest $env:GITHUB_SHA `
                      --signer-workflow $signerWorkflow
                  if ($LASTEXITCODE -ne 0) {
                      throw "Offline synthetic provenance verification failed"
                  }
              }
              $portable = Join-Path $bundle "assets\Youtube-Downloaderbs-v0.0.0-ci.zip"
              & gh attestation verify $portable `
                  --repo $repository `
                  --bundle $env:SBOM_BUNDLE `
                  --custom-trusted-root $trustedRootPath `
                  --predicate-type "https://spdx.dev/Document/v2.3" `
                  --source-digest $env:GITHUB_SHA `
                  --signer-workflow $signerWorkflow
              if ($LASTEXITCODE -ne 0) {
                  throw "Offline synthetic SBOM verification failed"
              }
          }
          finally {
              foreach ($name in $savedEnvironment.Keys) {
                  [Environment]::SetEnvironmentVariable($name, $savedEnvironment[$name])
              }
          }
          Write-Host "Offline synthetic provenance and SBOM attestation bundles verified"
