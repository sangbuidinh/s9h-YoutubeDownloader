name: Prerelease v1.2.7-rc.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prerelease-v1.2.7-rc.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build and validate assets
        shell: pwsh
        run: .\scripts\build_prerelease_v1_2_7_rc1.ps1
      - name: Keep downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Youtube-Downloaderbs-v1.2.7-rc.1
          path: release/assets/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7-rc.1
          name: Youtube Downloaderbs v1.2.7-rc.1
          prerelease: true
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/assets/Youtube.Downloaderbs.exe
            release/assets/Youtube-Downloaderbs-v1.2.7-rc.1.zip
