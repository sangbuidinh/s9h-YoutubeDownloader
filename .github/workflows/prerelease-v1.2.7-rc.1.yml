name: Prerelease v1.2.7-rc.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prerelease-v1.2.7-rc.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Verify pinned Python version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $VersionOutput = (& python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw "Could not query Python version"
          }
          if ($VersionOutput -ne "Python 3.11.9") {
              throw "Unexpected Python version: $VersionOutput"
          }

          Write-Host "Pinned Python verified: $VersionOutput"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build and validate assets
        shell: pwsh
        run: .\scripts\build_prerelease_v1_2_7_rc1.ps1
      - name: Keep downloadable workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Youtube-Downloaderbs-v1.2.7-rc.1
          path: release/assets/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.2.7-rc.1
          name: Youtube Downloaderbs v1.2.7-rc.1
          prerelease: true
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/assets/Youtube.Downloaderbs.exe
            release/assets/Youtube-Downloaderbs-v1.2.7-rc.1.zip
